name: Smoke test Android APK
on:
  push:
    paths:
      - .github/workflows/android-smoke.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smart-study-assistant-android-release-apk
          run-id: 36136609362
          github-token: ${{ github.token }}
          path: apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install apk/app-release.apk
            adb shell monkey -p com.mohamedadel.smartstudyassistant 1
            sleep 20
            adb shell pidof com.mohamedadel.smartstudyassistant
            if adb logcat -d -v brief | grep -E "FATAL EXCEPTION|Unable to start activity|ReactNativeJS.*Error:"; then exit 1; fi
