name: Smoke test Android APK
on:
  push:
    paths:
      - .github/workflows/android-smoke.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Enable emulator acceleration
        run: |
          echo "KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"" | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: smart-study-assistant-android-release-apk
          run-id: 36136609362
          github-token: ${{ github.token }}
          path: apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-linux-hw-accel: false
          disable-animations: true
          script: |
            adb install apk/app-release.apk
            adb logcat -c
            adb shell am start -n com.mohamedadel.smartstudyassistant/.MainActivity
            sleep 15
            adb logcat -d -v brief | grep -E "FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|UnsatisfiedLinkError|SoLoader|Unable to start activity|libc.*Fatal" | tail -100 || true
            adb shell pidof com.mohamedadel.smartstudyassistant
